services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://masjid:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/masjid
      ADMIN_INITIAL_PIN: ${ADMIN_INITIAL_PIN:?Set ADMIN_INITIAL_PIN}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: masjid
      POSTGRES_USER: masjid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masjid -d masjid"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads:
